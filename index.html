<style>

/* PlanToBee — açık bej zemin, bal sarısı + siyah marka; mavi mürekkep (ders), çim yeşili (antrenman), mercan (etkinlik) */
:root {
  /* Açık bej tema (PlanToBee: bal sarısı + siyah). Cihaz koyu modda olsa da açık tema kullanılır. */
  color-scheme: light;
  --bg: #F3ECDC;
  --surface: #FFFCF5;
  --surface-2: #F8F2E6;
  --ink: #1E1A14;
  --ink-soft: #675E4F;
  --ink-faint: #A0967F;
  --line: #E5DBC6;
  --line-strong: #D3C6AB;

  --study: #2F5BD8;
  --study-soft: #E4E8F6;
  --sport: #17936A;
  --sport-soft: #DDF0E4;
  --sport-deep: #0F6B4C;
  --event: #D9502F;
  --event-soft: #F9E3D8;
  --warn: #B7791F;
  --warn-soft: #F8ECD0;
  --danger: #C4372B;
  --danger-soft: #F9E6E1;

  --honey: #F6B51E;
  --on-accent: #FFFFFF;
  --hero-bg: #1E1A14;
  --hero-ink: #FBF6EA;
  --hero-soft: #BDB29B;
  --hero-line: #3A3328;

  --radius: 18px;
  --radius-sm: 11px;
  --shadow: 0 1px 2px rgba(30, 26, 20, .05), 0 6px 20px -10px rgba(30, 26, 20, .2);

  --f-display: 'Bricolage Grotesque', 'Figtree', system-ui, sans-serif;
  --f-body: 'Figtree', system-ui, -apple-system, 'Segoe UI', sans-serif;
  --f-mono: 'JetBrains Mono', ui-monospace, 'SF Mono', Menlo, monospace;
}

* { box-sizing: border-box; }
body { margin: 0; background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 14px; line-height: 1.45; -webkit-font-smoothing: antialiased; }
button, input, select { font: inherit; color: inherit; }
button { cursor: pointer; }
:focus-visible { outline: 2px solid var(--study); outline-offset: 2px; }
.wrap { max-width: 560px; margin: 0 auto; padding: 20px 16px 64px; }
h1, h2, h3 { font-family: var(--f-display); margin: 0; letter-spacing: -0.02em; text-wrap: balance; }

/* Header */
header.top { display: flex; align-items: center; justify-content: space-between; margin-bottom: 16px; }
header.top h1 { font-size: 24px; font-weight: 800; display: flex; align-items: center; gap: 8px; }
header.top h1 .logo { width: 30px; height: 30px; display: block; flex-shrink: 0; }
.auth-logo { width: 52px; height: 52px; display: block; margin-bottom: 14px; }
header.top .tag { font-family: var(--f-mono); font-size: 11px; color: var(--ink-soft); background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 5px 10px 5px 6px; display: inline-flex; align-items: center; gap: 7px; }
header.top .tag .av { width: 20px; height: 20px; border-radius: 50%; background: var(--study-soft); color: var(--study); display: grid; place-items: center; font-weight: 600; text-transform: uppercase; }
.logout-btn { background: none; border: 1px solid var(--line-strong); border-radius: 999px; padding: 7px 14px; font-size: 12px; font-family: var(--f-mono); color: var(--ink-soft); }
.logout-btn:hover { border-color: var(--ink); color: var(--ink); }

/* Segmented view tabs */
.viewtabs { display: flex; gap: 4px; margin-bottom: 16px; padding: 4px; background: var(--surface); border: 1px solid var(--line); border-radius: 14px; }
.viewtabs button { flex: 1; padding: 9px; border-radius: 10px; border: none; background: none; font-weight: 600; font-size: 13px; color: var(--ink-soft); transition: background .15s, color .15s; }
.viewtabs button:hover { color: var(--ink); }
.viewtabs button.active { background: var(--ink); color: var(--bg); }

/* Day hero: date nav + week trail + stats in one dark panel */
.dayhero { background: var(--hero-bg); color: var(--hero-ink); border-radius: 22px; padding: 16px 14px 14px; margin-bottom: 16px; box-shadow: var(--shadow); }
.datenav { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 14px; }
.datenav button { width: 38px; height: 38px; flex-shrink: 0; border-radius: 12px; border: 1px solid var(--hero-line); background: none; color: var(--hero-ink); font-size: 18px; display: grid; place-items: center; }
.datenav button:hover { background: var(--hero-line); }
.datenav .label { text-align: center; flex: 1; min-width: 0; }
.datenav .label .day { font-family: var(--f-display); font-size: 26px; font-weight: 800; letter-spacing: -0.03em; line-height: 1.1; }
.datenav .label .sub { font-size: 11px; color: var(--hero-soft); font-family: var(--f-mono); margin-top: 2px; }
.datenav .label .sub .today { color: var(--hero-bg); background: var(--sport); border-radius: 999px; padding: 1px 7px; margin-left: 4px; font-weight: 600; }

.trail { display: grid; grid-template-columns: repeat(7, 1fr); gap: 4px; }
.trail-dot { display: flex; flex-direction: column; align-items: center; gap: 6px; border: 1px solid transparent; background: none; padding: 8px 0 7px; border-radius: 12px; color: var(--hero-soft); }
.trail-dot:hover { background: rgba(255, 255, 255, .05); }
.trail-dot .wk { font-family: var(--f-mono); font-size: 10px; text-transform: uppercase; letter-spacing: .04em; }
.trail-dot .num { font-family: var(--f-display); font-size: 16px; font-weight: 700; color: var(--hero-ink); line-height: 1; }
.trail-dot .pips { display: flex; gap: 3px; height: 6px; }
.trail-dot .pip { width: 6px; height: 6px; border-radius: 50%; background: var(--hero-line); }
.trail-dot .pip.study { background: var(--study); }
.trail-dot .pip.sport { background: var(--sport); }
.trail-dot .pip.evt { background: var(--event); }
.trail-dot.selected { background: var(--hero-ink); color: var(--hero-bg); }
.trail-dot.selected .num { color: var(--hero-bg); }
.trail-dot.istoday:not(.selected) { border-color: var(--hero-line); }
.trail-dot.istoday .wk { font-weight: 600; }

.stats { display: grid; grid-template-columns: repeat(3, 1fr); gap: 8px; margin-top: 14px; padding-top: 14px; border-top: 1px dashed var(--hero-line); }
.stat { text-align: left; padding: 0 4px; }
.stat .num { font-family: var(--f-display); font-size: 22px; font-weight: 700; font-variant-numeric: tabular-nums; line-height: 1.1; display: flex; align-items: baseline; gap: 4px; }
.stat .num small { font-family: var(--f-mono); font-size: 10px; font-weight: 400; color: var(--hero-soft); }
.stat .lbl { font-size: 10.5px; color: var(--hero-soft); display: flex; align-items: center; gap: 5px; margin-top: 2px; }
.stat .lbl::before { content: ''; width: 7px; height: 7px; border-radius: 2px; background: currentColor; }
.stat.study .lbl::before { background: var(--study); }
.stat.sport .lbl::before { background: var(--sport); }
.stat.evt .lbl::before { background: var(--event); }
/* Week page shows stats outside the hero */
.stats.standalone { background: var(--hero-bg); color: var(--hero-ink); border: none; border-radius: var(--radius); padding: 14px; margin: 0 0 14px; }

/* Cards */
.card { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 16px; margin-bottom: 14px; box-shadow: var(--shadow); }
.card-head { display: flex; align-items: center; justify-content: space-between; gap: 10px; margin-bottom: 12px; }
.card-title { display: flex; align-items: center; gap: 10px; }
.card-head h2 { font-size: 18px; font-weight: 700; }
.card-head .total { font-family: var(--f-mono); font-size: 11px; color: var(--ink-soft); background: var(--surface-2); border: 1px solid var(--line); padding: 4px 9px; border-radius: 999px; white-space: nowrap; }
.icon-tile { width: 34px; height: 34px; border-radius: 10px; display: grid; place-items: center; flex-shrink: 0; }
.icon-tile.study { background: var(--study-soft); color: var(--study); }
.icon-tile.sport { background: var(--sport-soft); color: var(--sport); }
.icon-tile.evt { background: var(--event-soft); color: var(--event); }
.icon { width: 19px; height: 19px; flex-shrink: 0; }
.hint { font-size: 11.5px; color: var(--ink-faint); margin: -4px 0 8px; }

.entry { display: flex; align-items: center; gap: 10px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.entry:last-child { border-bottom: none; }
.entry .swatch { width: 4px; align-self: stretch; border-radius: 4px; background: var(--study); flex-shrink: 0; }
.entry .swatch.sport { background: var(--sport); }
.entry .swatch.evt { background: var(--event); }
.status-badge { border: 1px solid transparent; font-family: var(--f-mono); font-size: 10px; font-weight: 500; letter-spacing: .01em; padding: 5px 9px 5px 7px; border-radius: 999px; flex-shrink: 0; white-space: nowrap; display: inline-flex; align-items: center; gap: 5px; }
.status-badge::before { content: ''; width: 8px; height: 8px; border-radius: 50%; border: 1.5px solid currentColor; }
.status-badge.status-todo { background: var(--surface-2); border-color: var(--line); color: var(--ink-soft); }
.status-badge.status-inprogress { background: var(--warn-soft); color: var(--warn); }
.status-badge.status-inprogress::before { background: linear-gradient(90deg, currentColor 50%, transparent 50%); }
.status-badge.status-done { background: var(--sport-soft); color: var(--sport-deep); }
.status-badge.status-done::before { background: currentColor; }
.entry .info { flex: 1; min-width: 0; }
.entry .info .subj { font-weight: 600; font-size: 14.5px; }
.entry .info .subj.done { text-decoration: line-through; opacity: .55; }
.entry .info .topic { font-size: 12.5px; color: var(--ink-soft); overflow-wrap: anywhere; }
.entry .mins { font-family: var(--f-mono); font-size: 12px; font-weight: 500; color: var(--study); background: var(--study-soft); padding: 4px 9px; border-radius: 8px; white-space: nowrap; font-variant-numeric: tabular-nums; }
.entry .mins.sport { color: var(--sport-deep); background: var(--sport-soft); }
.entry .mins.evt { color: var(--event); background: var(--event-soft); }
.entry .del, .entry .edit { background: none; border: none; color: var(--ink-faint); width: 28px; height: 28px; border-radius: 8px; display: grid; place-items: center; font-size: 16px; padding: 0; flex-shrink: 0; }
.entry .edit { font-size: 13px; }
.entry .del:hover { background: var(--danger-soft); color: var(--danger); }
.entry .edit:hover { background: var(--surface-2); color: var(--ink); }

.field, .edit-form input, .addform input, .addform select, .subject-addrow input, .quickrow select, .quickrow input, .auth-card input {
  border: 1px solid var(--line); border-radius: var(--radius-sm); padding: 9px 11px; font-size: 13.5px; background: var(--surface-2); min-width: 0;
}
.edit-form input:focus, .addform input:focus, .addform select:focus, .subject-addrow input:focus, .quickrow select:focus, .quickrow input:focus, .auth-card input:focus {
  outline: none; border-color: var(--study); background: var(--surface); box-shadow: 0 0 0 3px var(--study-soft);
}

.edit-form { display: flex; flex-wrap: wrap; gap: 8px; padding: 10px 0; border-bottom: 1px solid var(--line); }
.edit-form input { flex: 1 1 120px; }
.btn, .edit-form .save, .addform button, .subject-addrow button, .auth-submit { background: var(--ink); color: var(--bg); border: none; border-radius: var(--radius-sm); padding: 9px 16px; font-size: 13px; font-weight: 700; }
.edit-form .save { background: var(--event); color: var(--on-accent); }
.edit-form .cancel { background: none; border: 1px solid var(--line-strong); color: var(--ink-soft); border-radius: var(--radius-sm); padding: 8px 12px; font-size: 12.5px; }
.empty-note { color: var(--ink-faint); font-size: 13px; padding: 12px; margin-bottom: 4px; text-align: center; border: 1px dashed var(--line-strong); border-radius: var(--radius-sm); }

.addform { display: flex; flex-wrap: wrap; gap: 8px; margin-top: 12px; padding-top: 12px; border-top: 1px solid var(--line); }
.addform input, .addform select { flex: 2 1 140px; }
.addform select { flex: 1 1 120px; }
.addform input[type="number"] { flex: 0 0 64px; }
.addform button { background: var(--study); color: var(--on-accent); }
.addform.sport button { background: var(--sport); }
.addform.event button { background: var(--event); }

.manage-toggle { background: none; border: none; color: var(--ink-soft); font-size: 12px; font-weight: 600; padding: 0; margin-top: 12px; display: inline-flex; gap: 6px; align-items: center; }
.manage-toggle:hover { color: var(--study); }
.subject-panel { margin-top: 10px; padding: 12px; background: var(--surface-2); border-radius: var(--radius-sm); }
.subject-chip { display: inline-flex; align-items: center; gap: 4px; font-size: 12.5px; font-weight: 600; padding: 4px 4px 4px 11px; border-radius: 999px; background: var(--study-soft); color: var(--study); margin: 0 6px 6px 0; }
.subject-chip .x { font-weight: 700; background: none; border: none; color: inherit; font-size: 14px; line-height: 1; width: 20px; height: 20px; border-radius: 50%; padding: 0; }
.subject-chip .x:hover { background: var(--study); color: var(--on-accent); }
.subject-addrow { display: flex; gap: 8px; margin-top: 6px; }
.subject-addrow input { flex: 1; background: var(--surface); }
.subject-addrow button { background: var(--study); color: var(--on-accent); }

.note { font-size: 12px; color: var(--ink-faint); text-align: center; margin-top: 22px; line-height: 1.55; text-wrap: balance; }

/* Week view */
.weeknav { display: flex; align-items: center; justify-content: space-between; gap: 8px; margin-bottom: 14px; }
.weeknav button { background: var(--surface); border: 1px solid var(--line); border-radius: 999px; padding: 7px 14px; font-size: 13px; font-weight: 600; color: var(--ink-soft); }
.weeknav button:hover { color: var(--ink); border-color: var(--line-strong); }
.weeknav .rng { font-family: var(--f-display); font-weight: 700; font-size: 17px; letter-spacing: -0.02em; }
.weekcard { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 14px; margin-bottom: 10px; display: grid; grid-template-columns: 46px 1fr; gap: 0 12px; }
.weekcard.today { border-color: var(--ink); box-shadow: var(--shadow); }
.weekcard .datecol { text-align: center; padding-top: 2px; }
.weekcard .datecol .dn { font-family: var(--f-display); font-size: 24px; font-weight: 800; line-height: 1; letter-spacing: -0.03em; }
.weekcard .datecol .dw { font-family: var(--f-mono); font-size: 10px; text-transform: uppercase; color: var(--ink-soft); margin-top: 3px; }
.weekcard.today .datecol .dn { color: var(--study); }
.weekcard .body { min-width: 0; }
.weekcard-head { display: flex; justify-content: space-between; align-items: center; margin-bottom: 4px; }
.weekcard-head .wd { font-weight: 700; font-size: 14px; }
.weekcard-head .datep { font-family: var(--f-mono); font-weight: 400; font-size: 11px; color: var(--ink-soft); margin-left: 6px; }
.weekcard-head .goto { background: none; border: none; color: var(--study); font-size: 12px; font-weight: 600; padding: 4px 0; }
.sectionlbl { font-size: 10px; font-family: var(--f-mono); text-transform: uppercase; letter-spacing: .06em; color: var(--ink-faint); margin: 10px 0 6px; display: flex; align-items: center; gap: 6px; }
.sectionlbl::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--study); }
.sectionlbl.sport::before { background: var(--sport); }
.sectionlbl.event::before { background: var(--event); }
.chiprow { display: flex; flex-wrap: wrap; gap: 6px; margin-bottom: 6px; }
.chip { display: inline-flex; align-items: center; gap: 4px; font-size: 11.5px; font-weight: 500; padding: 4px 4px 4px 10px; border-radius: 999px; font-family: var(--f-mono); }
.chip.study { background: var(--study-soft); color: var(--study); }
.chip.study.status-inprogress { background: var(--warn-soft); color: var(--warn); }
.chip.study.status-done { background: var(--sport-soft); color: var(--sport-deep); }
.chip.study.status-done .clicktext { text-decoration: line-through; }
.chip.sport { background: var(--sport-soft); color: var(--sport-deep); }
.chip.event { background: var(--event-soft); color: var(--event); }
.chip .x { background: none; border: none; color: inherit; font-weight: 700; width: 18px; height: 18px; border-radius: 50%; padding: 0; line-height: 1; opacity: .7; }
.chip .x:hover { opacity: 1; background: var(--surface); }
.chip .clicktext { cursor: pointer; background: none; border: none; color: inherit; font: inherit; padding: 0; }
.quickrow { display: flex; gap: 6px; margin-bottom: 4px; }
.quickrow select, .quickrow input { padding: 6px 9px; font-size: 12.5px; border-radius: 9px; flex: 1; }
.quickrow input.small { flex: 0 0 52px; }
.quickrow button { flex: 0 0 34px; background: var(--study); color: var(--on-accent); border: none; border-radius: 9px; font-size: 16px; font-weight: 700; padding: 0; }
.quickrow.sport button { background: var(--sport); }
.quickrow.event button { background: var(--event); }
.loading { text-align: center; padding: 48px 0; color: var(--ink-soft); font-size: 13px; font-family: var(--f-mono); }

/* Auth */
.auth-wrap { min-height: 100vh; display: flex; align-items: center; justify-content: center; background: var(--bg); padding: 20px 16px; }
.auth-card { background: var(--surface); border: 1px solid var(--line); border-radius: 24px; padding: 32px 26px; width: 100%; max-width: 390px; box-shadow: var(--shadow); }
.auth-card h1 { font-size: 32px; font-weight: 800; margin-bottom: 4px; }
.auth-sub { font-size: 14px; color: var(--ink-soft); margin: 0 0 24px; }
.auth-tabs { display: flex; gap: 4px; margin-bottom: 20px; padding: 4px; background: var(--surface-2); border-radius: 14px; }
.auth-tabs button { flex: 1; padding: 9px; border-radius: 10px; border: none; background: none; font-weight: 600; font-size: 13px; color: var(--ink-soft); }
.auth-tabs button.active { background: var(--ink); color: var(--bg); }
.auth-card form { display: flex; flex-direction: column; gap: 10px; }
.auth-card input { padding: 12px 14px; font-size: 14px; }
.auth-error { font-size: 12.5px; color: var(--danger); background: var(--danger-soft); border-radius: 10px; padding: 9px 12px; }
.auth-submit { padding: 13px; font-size: 14px; margin-top: 4px; }
.auth-submit:disabled { opacity: 0.6; cursor: not-allowed; }

@media (prefers-reduced-motion: reduce) { * { transition: none !important; } }

/* Sadece index.html (Firebase sürümü) */
.addform input[name="minutes"], .addform input[name="time"] { flex: 0 0 72px; }
.addform input[name="topic"], .addform input[name="note"] { flex: 2 1 140px; }
.edit-form input[name="etime"] { flex: 0 0 72px; }
.input-error { border-color: var(--danger) !important; box-shadow: 0 0 0 3px var(--danger-soft) !important; animation: shake .25s; }
@keyframes shake { 0%,100% { transform: translateX(0); } 25% { transform: translateX(-3px); } 75% { transform: translateX(3px); } }
.hist-toggle { display: block; width: 100%; text-align: center; background: none; border: 1px dashed var(--line-strong); border-radius: var(--radius-sm); padding: 11px; color: var(--ink-soft); font-size: 12.5px; font-weight: 600; margin-bottom: 14px; }
.hist-toggle:hover { color: var(--ink); border-color: var(--ink-soft); }
.hist-row { display: flex; align-items: center; gap: 12px; padding: 10px 6px; border-bottom: 1px solid var(--line); cursor: pointer; border-radius: 8px; }
.hist-row:last-child { border-bottom: none; }
.hist-row:hover { background: var(--surface-2); }
.hist-row .d { width: 62px; flex-shrink: 0; color: var(--ink-soft); font-family: var(--f-mono); font-size: 11.5px; }
.hist-row .badges { display: flex; gap: 5px; flex-wrap: wrap; }
.hist-row .badge { font-size: 10.5px; padding: 3px 8px; border-radius: 999px; font-family: var(--f-mono); }
.hist-row .badge.study { background: var(--study-soft); color: var(--study); }
.hist-row .badge.sport { background: var(--sport-soft); color: var(--sport-deep); }
.hist-row .badge.event { background: var(--event-soft); color: var(--event); }
.err-box { text-align: left; white-space: pre-wrap; font-family: var(--f-mono); font-size: 12px; color: var(--danger); background: var(--danger-soft); border-radius: var(--radius-sm); padding: 14px; margin-top: 40px; }

/* Hafta tablo görünümü */
.wrap.wide { max-width: 900px; }
.modetoggle { display: inline-flex; gap: 2px; padding: 3px; background: var(--surface); border: 1px solid var(--line); border-radius: 999px; }
.modetoggle button { border: none; background: none; border-radius: 999px; padding: 5px 12px; font-size: 12px; font-weight: 600; color: var(--ink-soft); }
.modetoggle button.active { background: var(--ink); color: var(--bg); }
.weekbar { display: flex; align-items: center; justify-content: space-between; gap: 10px; flex-wrap: wrap; margin-bottom: 12px; }
.wkadd { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); padding: 10px; margin-bottom: 12px; box-shadow: var(--shadow); }
.wkadd select, .wkadd input { border: 1px solid var(--line); border-radius: 9px; padding: 7px 9px; font-size: 13px; background: var(--surface-2); min-width: 0; }
.wkadd select:focus, .wkadd input:focus { outline: none; border-color: var(--study); background: var(--surface); box-shadow: 0 0 0 3px var(--study-soft); }
.wkadd .kind { display: inline-flex; gap: 2px; padding: 3px; background: var(--surface-2); border-radius: 10px; }
.wkadd .kind button { border: none; background: none; border-radius: 8px; padding: 5px 9px; font-size: 12px; font-weight: 600; color: var(--ink-soft); }
.wkadd[data-kind="study"] .kind [data-k="study"] { background: var(--study); color: var(--on-accent); }
.wkadd[data-kind="sport"] .kind [data-k="sport"] { background: var(--sport); color: var(--on-accent); }
.wkadd[data-kind="event"] .kind [data-k="event"] { background: var(--event); color: var(--on-accent); }
.wkadd .f-study, .wkadd .f-sport, .wkadd .f-event { display: none; }
.wkadd[data-kind="study"] .f-study, .wkadd[data-kind="sport"] .f-sport, .wkadd[data-kind="event"] .f-event { display: block; }
.wkadd .grow { flex: 1 1 120px; }
.wkadd .num { flex: 0 0 64px; }
.wkadd .go { border: none; border-radius: 9px; padding: 8px 14px; font-size: 13px; font-weight: 700; background: var(--study); color: var(--on-accent); }
.wkadd[data-kind="sport"] .go { background: var(--sport); }
.wkadd[data-kind="event"] .go { background: var(--event); }

.wktable-wrap { background: var(--surface); border: 1px solid var(--line); border-radius: var(--radius); box-shadow: var(--shadow); overflow-x: auto; }
.wktable { width: 100%; border-collapse: collapse; table-layout: fixed; min-width: 340px; }
.wktable th, .wktable td { border-bottom: 1px solid var(--line); padding: 6px; vertical-align: top; text-align: left; }
.wktable tr:last-child > * { border-bottom: none; }
.wktable td + td, .wktable th + th, .wktable th + td { border-left: 1px solid var(--line); }
.wktable thead th { font-family: var(--f-mono); font-size: 10px; font-weight: 500; text-transform: uppercase; letter-spacing: .06em; color: var(--ink-faint); padding: 9px 8px; background: var(--surface-2); }
.wktable thead th .dotc { display: inline-block; width: 6px; height: 6px; border-radius: 50%; margin-right: 5px; vertical-align: 1px; }
.wktable col.c-day { width: 52px; }
.wktable .daycell button { background: none; border: none; padding: 2px 0; width: 100%; text-align: center; color: var(--ink); }
.wktable .daycell .dw { display: block; font-family: var(--f-mono); font-size: 9.5px; text-transform: uppercase; color: var(--ink-soft); }
.wktable .daycell .dn { display: block; font-family: var(--f-display); font-size: 19px; font-weight: 800; line-height: 1.1; }
.wktable tr.today .daycell .dn { color: var(--study); }
.wktable tr.today > * { background: color-mix(in srgb, var(--study-soft) 45%, transparent); }
.wktable tr.weekend .daycell .dw { color: var(--event); }
.wktable .cell { display: flex; flex-wrap: wrap; gap: 4px; align-items: flex-start; min-height: 26px; }
.wktable .chip { font-size: 11px; padding: 3px 3px 3px 8px; max-width: 100%; }
.wktable .chip .clicktext, .wktable .chip .lbl { white-space: normal; text-align: left; overflow-wrap: anywhere; }
.wktable .plus { border: 1px dashed var(--line-strong); background: none; color: var(--ink-faint); border-radius: 999px; width: 24px; height: 22px; font-size: 14px; line-height: 1; padding: 0; opacity: .6; }
.wktable tr:hover .plus, .wktable .plus:focus-visible { opacity: 1; }
.wktable .plus:hover { color: var(--ink); border-color: var(--ink-soft); }
.wktable tfoot td, .wktable tfoot th { border-top: 1px solid var(--line-strong); background: var(--surface-2); font-family: var(--f-mono); font-size: 11px; color: var(--ink-soft); padding: 8px; }
.wktable tfoot b { color: var(--ink); font-weight: 600; }
@media (max-width: 480px) {
  .wktable col.c-day { width: 40px; }
  .wktable th, .wktable td { padding: 5px 4px; }
  .wktable .chip { font-size: 10.5px; padding: 2px 2px 2px 6px; }
  .wktable .daycell .dn { font-size: 16px; }
}

/* Kaydetme hatası bildirimi */
.toast { position: fixed; left: 50%; transform: translateX(-50%); bottom: calc(20px + env(safe-area-inset-bottom, 0px)); z-index: 50; max-width: min(92vw, 460px); background: var(--danger); color: #fff; font-size: 13.5px; font-weight: 600; line-height: 1.4; padding: 12px 16px; border-radius: 14px; box-shadow: var(--shadow); }
</style>
</head>
<body>
<div class="wrap" id="app"><div class="loading">Yükleniyor…</div></div>

<script>
const STUDY_ICON = `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><path d="M4 5.5C4 4.7 4.7 4 5.5 4H11v16H5.5A1.5 1.5 0 0 1 4 18.5v-13Z"/><path d="M20 5.5c0-.8-.7-1.5-1.5-1.5H13v16h5.5a1.5 1.5 0 0 0 1.5-1.5v-13Z"/></svg>`;
const SPORT_ICON = `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><circle cx="12" cy="12" r="9"/><path d="M12 3c2.5 2.5 2.5 15.5 0 18"/><path d="M4.5 8c4 2 11 2 15 0"/><path d="M4.5 16c4-2 11-2 15 0"/></svg>`;
const EVENT_ICON = `<svg class="icon" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8"><rect x="3.5" y="5" width="17" height="15" rx="2"/><path d="M8 3v4M16 3v4M3.5 10h17"/></svg>`;

const WEEKDAYS = ['Pzt','Sal','Çar','Per','Cum','Cmt','Paz'];
const WEEKDAYS_FULL = ['Pazartesi','Salı','Çarşamba','Perşembe','Cuma','Cumartesi','Pazar'];
const MONTHS = ['Ocak','Şubat','Mart','Nisan','Mayıs','Haziran','Temmuz','Ağustos','Eylül','Ekim','Kasım','Aralık'];

function dkey(d){ const y=d.getFullYear(), m=String(d.getMonth()+1).padStart(2,'0'), day=String(d.getDate()).padStart(2,'0'); return `${y}-${m}-${day}`; }
function mondayOf(d){ const nd=new Date(d); const dow=(nd.getDay()+6)%7; nd.setDate(nd.getDate()-dow); nd.setHours(0,0,0,0); return nd; }
function addDays(d,n){ const nd=new Date(d); nd.setDate(nd.getDate()+n); return nd; }
function sameDay(a,b){ return dkey(a)===dkey(b); }
function emptyDay(){ return { studyEntries:[], training:[], events:[] }; }
function migrateTraining(raw){
  if(Array.isArray(raw)) return raw;
  if(raw && typeof raw==='object' && raw.done){ return [{id:'legacy-'+Math.random(), type:'Antrenman', minutes:raw.minutes||'', note:raw.note||''}]; }
  return [];
}

let state = { currentDate: new Date(), days:{}, saved:{}, index:[], view:'day', historyOpen:false, subjects:[], subjectsOpen:false, editingEventId:null, weekMode:readPref('weekMode','table'), wkAdd:{day:null, kind:'study'} };
function readPref(k,def){ try{ return localStorage.getItem(k)||def; }catch(e){ return def; } }
function writePref(k,v){ try{ localStorage.setItem(k,v); }catch(e){} }

const DEFAULT_SUBJECTS = ['Matematik','Geometri','Fizik','Kimya','Biyoloji','Türkçe','Tarih','Coğrafya','Felsefe','İngilizce'];

async function loadSubjects(){
  const snap = await db.ref('subjects').get();
  if(snap.exists()) return snap.val();
  await db.ref('subjects').set(DEFAULT_SUBJECTS);
  return DEFAULT_SUBJECTS;
}
async function saveSubjects(list){
  const prev = state.subjects;
  state.subjects = list;
  try{ await db.ref('subjects').set(list); }
  catch(e){ console.error('subjects save failed', e); state.subjects = prev; showToast(SAVE_FAILED_MSG); }
}
async function addSubject(name){
  name = (name||'').trim();
  if(!name || state.subjects.includes(name)) return;
  await saveSubjects([...state.subjects, name]);
  render();
}
async function deleteSubject(name){
  await saveSubjects(state.subjects.filter(s=>s!==name));
  render();
}
function toggleSubjectsPanel(){ state.subjectsOpen = !state.subjectsOpen; render(); }

async function loadIndex(){
  const snap = await db.ref('daysIndex').get();
  return snap.exists() ? Object.values(snap.val()) : [];
}
async function saveIndex(idx){
  idx.sort((a,b)=> a.date < b.date ? 1 : -1);
  try{ await db.ref('daysIndex').set(idx); }catch(e){ console.error('index save failed', e); showToast('Haftalık özet güncellenemedi. Sayfayı yenileyip tekrar dene.'); }
}
async function loadDay(key){
  const snap = await db.ref('days/'+key).get();
  if(snap.exists()){
    const p = snap.val();
    return { studyEntries: (p.studyEntries||[]).map(e=>({...e, status: e.status || 'done'})), training: migrateTraining(p.training), events: p.events||[] };
  }
  return emptyDay();
}
async function ensureDay(key){
  if(state.days[key]) return state.days[key];
  const d = await loadDay(key);
  state.days[key] = d;
  state.saved[key] = clone(d);
  return d;
}
function computeSummary(key,data){
  const studyMinutes = data.studyEntries.reduce((s,e)=>s+(parseInt(e.minutes)||0),0);
  const trainingMinutes = data.training.reduce((s,e)=>s+(parseInt(e.minutes)||0),0);
  return { date:key, studyMinutes, entryCount:data.studyEntries.length, trainingDone: data.training.length>0, trainingCount: data.training.length, trainingMinutes, eventCount: (data.events||[]).length };
}
// Kayıt başarısız olursa gün, son başarılı kaydedilen haline döner; kullanıcı uyarılır.
async function persist(key){
  const data = state.days[key];
  try{ await db.ref('days/'+key).set(data); }
  catch(e){
    console.error('save failed', e);
    state.days[key] = clone(state.saved[key] || emptyDay());
    showToast(SAVE_FAILED_MSG);
    return false;
  }
  state.saved[key] = clone(data);
  const summary = computeSummary(key,data);
  const idx = state.index.filter(e=>e.date!==key);
  if(summary.studyMinutes>0 || summary.trainingDone || summary.eventCount>0) idx.push(summary);
  state.index = idx;
  await saveIndex(idx);
  return true;
}

const SAVE_FAILED_MSG = 'Kaydedilemedi, değişiklik geri alındı. İnternet bağlantını kontrol edip tekrar dene.';
function clone(o){ return JSON.parse(JSON.stringify(o)); }
let toastTimer = null;
function showToast(msg){
  let t = document.getElementById('toast');
  if(!t){ t = document.createElement('div'); t.id = 'toast'; t.className = 'toast'; t.setAttribute('role','alert'); document.body.appendChild(t); }
  t.textContent = msg;
  t.hidden = false;
  clearTimeout(toastTimer);
  toastTimer = setTimeout(()=>{ t.hidden = true; }, 6000);
}
function summaryFor(key){ return state.index.find(e=>e.date===key); }
function getDay(key){ return state.days[key] || emptyDay(); }

// ---- navigation ----
async function goToDate(d){
  state.currentDate = d;
  state.view = 'day';
  await ensureDay(dkey(d));
  render();
}
async function showWeek(){
  state.view = 'week';
  const mon = mondayOf(state.currentDate);
  const keys = []; for(let i=0;i<7;i++) keys.push(dkey(addDays(mon,i)));
  await Promise.all(keys.map(ensureDay));
  render();
}
async function showDay(){ state.view='day'; await ensureDay(dkey(state.currentDate)); render(); }
async function shiftWeek(delta){ state.currentDate = addDays(state.currentDate, delta*7); await showWeek(); }

// ---- actions (all keyed by date string) ----
async function addEntry(key, subject, topic, minutes){
  if(!subject || !minutes) return;
  const data = await ensureDay(key);
  data.studyEntries.push({id:Date.now()+Math.random(), subject, topic, minutes, status:'todo'});
  await persist(key); render();
}
async function delEntry(key,id){
  const data = await ensureDay(key);
  data.studyEntries = data.studyEntries.filter(e=>e.id!==id);
  await persist(key); render();
}
const STATUS_ORDER = ['todo','inprogress','done'];
const STATUS_SHORT = {todo:'Yapılacak', inprogress:'Devam Ediyor', done:'Tamamlandı'};
async function cycleStatus(key,id){
  const data = await ensureDay(key);
  const e = data.studyEntries.find(x=>x.id===id);
  if(!e) return;
  const idx = STATUS_ORDER.indexOf(e.status||'todo');
  e.status = STATUS_ORDER[(idx+1)%STATUS_ORDER.length];
  await persist(key); render();
}
async function addTraining(key, type, minutes, note){
  if(!type || !minutes) return;
  const data = await ensureDay(key);
  data.training.push({id:Date.now()+Math.random(), type, minutes, note: note||''});
  await persist(key); render();
}
async function delTraining(key,id){
  const data = await ensureDay(key);
  data.training = data.training.filter(e=>e.id!==id);
  await persist(key); render();
}
async function addEvent(key,title,time,note){
  if(!title) return;
  const data = await ensureDay(key);
  data.events = data.events || [];
  data.events.push({id:Date.now()+Math.random(), title, time: time||'', note: note||''});
  await persist(key); render();
}
async function delEvent(key,id){
  const data = await ensureDay(key);
  data.events = (data.events||[]).filter(e=>e.id!==id);
  await persist(key); render();
}
async function updateEvent(key,id,title,time,note){
  if(!title) return;
  const data = await ensureDay(key);
  const e = (data.events||[]).find(x=>x.id===id);
  if(!e) return;
  e.title = title; e.time = time||''; e.note = note||'';
  await persist(key);
  state.editingEventId = null;
  render();
}
function startEditEvent(id){ state.editingEventId = id; render(); }
function cancelEditEvent(){ state.editingEventId = null; render(); }

async function init(){
  try{
    await firebase.auth().signInAnonymously();
  }catch(e){
    console.error('auth failed', e);
    document.getElementById('app').innerHTML = '<div class="err-box">GİRİŞ HATASI:<br>Kod: '+(e.code||'yok')+'<br>Mesaj: '+(e.message||e)+'</div>';
    return;
  }
  try{
    state.index = await loadIndex();
    state.subjects = await loadSubjects();
    await ensureDay(dkey(state.currentDate));
    render();
  }catch(e){
    console.error('data load failed', e);
    document.getElementById('app').innerHTML = '<div class="err-box">VERİ OKUMA HATASI:<br>Kod: '+(e.code||'yok')+'<br>Mesaj: '+(e.message||e)+'</div>';
  }
}

// ---- render dispatch ----
function render(){
  const app = document.getElementById('app');
  app.classList.toggle('wide', state.view==='week' && state.weekMode==='table');
  app.innerHTML = `
    <header class="top"><h1><img class="logo" src="favicon.svg" alt="">PlanToBee</h1><span class="tag"><span class="av">E</span>Ela Ada İşler</span></header>
    <div class="viewtabs">
      <button class="${state.view==='day'?'active':''}" onclick="showDay()">Gün</button>
      <button class="${state.view==='week'?'active':''}" onclick="showWeek()">Hafta Planı</button>
    </div>
    <div id="body"></div>
  `;
  const body = document.getElementById('body');
  if(state.view==='week') body.innerHTML = renderWeekHtml();
  else body.innerHTML = renderDayHtml();
}

function renderTrail(d){
  const mon = mondayOf(d);
  let html='';
  for(let i=0;i<7;i++){
    const wd = addDays(mon,i); const wkey = dkey(wd); const s = summaryFor(wkey);
    const hasStudy = s && s.studyMinutes>0, hasSport = s && s.trainingDone, hasEvt = s && s.eventCount>0;
    const selCls = sameDay(wd,d) ? 'selected' : '';
    const todayCls = sameDay(wd,new Date()) ? 'istoday' : '';
        html += `<button class="trail-dot ${selCls} ${todayCls}" onclick="goToDate(new Date(${wd.getFullYear()},${wd.getMonth()},${wd.getDate()}))">
      <span class="wk">${WEEKDAYS[i]}</span><span class="num">${wd.getDate()}</span>
      <span class="pips"><span class="pip${hasStudy?' study':''}"></span><span class="pip${hasSport?' sport':''}"></span><span class="pip${hasEvt?' evt':''}"></span></span></button>`;
  }
  return html;
}
function weekStats(d){
  const mon = mondayOf(d); let ws=0, wt=0, we=0;
  for(let i=0;i<7;i++){ const s=summaryFor(dkey(addDays(mon,i))); if(s){ ws+=s.studyMinutes; if(s.trainingDone) wt++; we+=s.eventCount||0; } }
  return {ws,wt,we};
}
function statsHtml(ws,wt,we,standalone){
  return `<div class="stats${standalone?' standalone':''}">
    <div class="stat study"><div class="num">${ws}<small>dk</small></div><div class="lbl">Haftalık ders</div></div>
    <div class="stat sport"><div class="num">${wt}<small>/7 gün</small></div><div class="lbl">Antrenman</div></div>
    <div class="stat evt"><div class="num">${we}</div><div class="lbl">Etkinlik</div></div>
  </div>`;
}
// onclick="fn(${jsAttr(x)})" için: JSON literal'i öznitelik içinde güvenli hale getirir (tırnak, kesme işareti vb.)
function jsAttr(v){ return escapeHtml(JSON.stringify(v)); }
function escapeHtml(s){ return String(s).replace(/[&<>"']/g, c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c])); }
function flashError(el){
  if(!el) return;
  el.classList.add('input-error');
  const clear = ()=>{ el.classList.remove('input-error'); };
  el.addEventListener('input', clear, {once:true});
  el.addEventListener('change', clear, {once:true});
  setTimeout(clear, 2500);
}
function formatDuration(mins){
  mins = parseInt(mins)||0;
  const h = Math.floor(mins/60), m = mins%60;
  if(h===0) return `${m} dk`;
  if(m===0) return `${h} sa`;
  return `${h} sa ${m} dk`;
}

function renderDayHtml(){
  const d = state.currentDate, key = dkey(d), data = getDay(key), isToday = sameDay(d,new Date());
  const totalMinutes = data.studyEntries.reduce((s,e)=>s+(parseInt(e.minutes)||0),0);
  const {ws,wt,we} = weekStats(d);

  let entriesHtml = data.studyEntries.length===0
    ? `<div class="empty-note">Bu gün için henüz ders kaydı yok.</div>`
    : data.studyEntries.map(e=>{
        const st = e.status||'todo';
        return `<div class="entry"><button class="status-badge status-${st}" onclick="cycleStatus('${key}', ${jsAttr(e.id)})">${STATUS_SHORT[st]}</button><div class="info"><div class="subj${st==='done'?' done':''}">${escapeHtml(e.subject)}</div>${e.topic?`<div class="topic">${escapeHtml(e.topic)}</div>`:''}</div><span class="mins">${escapeHtml(e.minutes)} dk</span><button class="del" aria-label="Sil" onclick="delEntry('${key}', ${jsAttr(e.id)})">×</button></div>`;
      }).join('');

  const trainingMinutes = data.training.reduce((s,e)=>s+(parseInt(e.minutes)||0),0);
  let trainingHtml = data.training.length===0
    ? `<div class="empty-note">Bu gün için henüz antrenman kaydı yok.</div>`
    : data.training.map(e=>`<div class="entry"><span class="swatch sport"></span><div class="info"><div class="subj">${escapeHtml(e.type)}</div>${e.note?`<div class="topic">${escapeHtml(e.note)}</div>`:''}</div><span class="mins sport">${formatDuration(e.minutes)}</span><button class="del" aria-label="Sil" onclick="delTraining('${key}', ${jsAttr(e.id)})">×</button></div>`).join('');

  const events = data.events||[];
  let eventsHtml = events.length===0
    ? `<div class="empty-note">Bu gün için planlı etkinlik yok.</div>`
    : events.map(e=>{
        if(state.editingEventId===e.id){
          return `<form class="edit-form" onsubmit="return handleUpdateEvent(event,'${key}',${jsAttr(e.id)})">
            <input name="etitle" placeholder="Etkinlik" value="${escapeHtml(e.title)}" autocomplete="off">
            <input name="etime" placeholder="Saat" value="${escapeHtml(e.time||'')}" autocomplete="off">
            <input name="enote" placeholder="Not" value="${escapeHtml(e.note||'')}" autocomplete="off">
            <button type="submit" class="save">Kaydet</button>
            <button type="button" class="cancel" onclick="cancelEditEvent()">İptal</button>
          </form>`;
        }
        return `<div class="entry"><span class="swatch evt"></span><div class="info"><div class="subj">${escapeHtml(e.title)}</div>${e.note?`<div class="topic">${escapeHtml(e.note)}</div>`:''}</div>${e.time?`<span class="mins evt">${escapeHtml(e.time)}</span>`:''}<button class="edit" aria-label="Düzenle" onclick="startEditEvent(${jsAttr(e.id)})">✎</button><button class="del" aria-label="Sil" onclick="delEvent('${key}', ${jsAttr(e.id)})">×</button></div>`;
      }).join('');

  let historyHtml = '';
  if(state.historyOpen){
    const rows = [...state.index].sort((a,b)=> a.date<b.date?1:-1).slice(0,21);
    historyHtml = rows.length===0 ? `<div class="card"><div class="empty-note">Henüz geçmiş kayıt yok.</div></div>` :
      `<div class="card">` + rows.map(r=>{
        const [y,m,dd] = r.date.split('-'); const disp = `${dd} ${MONTHS[parseInt(m)-1].slice(0,3)}`;
        return `<div class="hist-row" onclick="goToDate(new Date(${y},${parseInt(m)-1},${parseInt(dd)}))">
          <span class="d">${disp}</span><div class="badges">
            ${r.studyMinutes>0?`<span class="badge study">${r.studyMinutes} dk ders</span>`:''}
            ${r.trainingDone?`<span class="badge sport">antrenman</span>`:''}
            ${r.eventCount>0?`<span class="badge event">${r.eventCount} etkinlik</span>`:''}
          </div></div>`;
      }).join('') + `</div>`;
  }

  return `
    <section class="dayhero">
      <div class="datenav">
        <button aria-label="Önceki gün" onclick="goToDate(addDays(state.currentDate,-1))">‹</button>
        <div class="label"><div class="day">${WEEKDAYS_FULL[(d.getDay()+6)%7]}</div><div class="sub">${d.getDate()} ${MONTHS[d.getMonth()]} ${d.getFullYear()}${isToday?'<span class="today">bugün</span>':''}</div></div>
        <button aria-label="Sonraki gün" onclick="goToDate(addDays(state.currentDate,1))">›</button>
      </div>
      <div class="trail">${renderTrail(d)}</div>
      ${statsHtml(ws,wt,we,false)}
    </section>
    <div class="card">
      <div class="card-head"><div class="card-title"><span class="icon-tile study">${STUDY_ICON}</span><h2>Çalışma Planı</h2></div>${totalMinutes>0?`<span class="total">${totalMinutes} dk toplam</span>`:''}</div>
      <div class="hint">Rozete dokunarak durumu değiştirin: Yapılacak → Devam Ediyor → Tamamlandı</div>
      ${entriesHtml}
      <form class="addform" onsubmit="return handleAdd(event,'${key}')">
        <select name="subject">
          ${state.subjects.length===0?`<option value="">Önce ders ekleyin</option>`:state.subjects.map(s=>`<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join('')}
        </select>
        <input name="topic" placeholder="Konu (opsiyonel)" autocomplete="off">
        <input name="minutes" type="number" min="1" placeholder="dk">
        <button type="submit">Ekle</button>
      </form>
      <button class="manage-toggle" onclick="toggleSubjectsPanel()">${state.subjectsOpen?'▲ Ders listesini kapat':'✎ Dersleri düzenle (ekle/sil)'}</button>
      ${state.subjectsOpen?`
        <div class="subject-panel">
          ${state.subjects.map(s=>`<span class="subject-chip">${escapeHtml(s)}<button class="x" onclick="deleteSubject(${jsAttr(s)})">×</button></span>`).join('') || `<div class="empty-note">Henüz ders eklenmemiş.</div>`}
          <form class="subject-addrow" onsubmit="return handleAddSubject(event)">
            <input name="newsubject" placeholder="Yeni ders adı (ör. Almanca)" autocomplete="off">
            <button type="submit">Ekle</button>
          </form>
        </div>
      `:''}
    </div>
    <div class="card sport">
      <div class="card-head"><div class="card-title"><span class="icon-tile sport">${SPORT_ICON}</span><h2>Antrenman</h2></div>${trainingMinutes>0?`<span class="total">${formatDuration(trainingMinutes)} toplam</span>`:''}</div>
      ${trainingHtml}
      <form class="addform sport" onsubmit="return handleAddTraining(event,'${key}')">
        <select name="type">
          <option value="Top">Top</option>
          <option value="Kuvvet">Kuvvet</option>
        </select>
        <input name="minutes" type="number" min="1" placeholder="dk">
        <input name="note" placeholder="Not (opsiyonel)" autocomplete="off">
        <button type="submit">Ekle</button>
      </form>
    </div>
    <div class="card">
      <div class="card-head"><div class="card-title"><span class="icon-tile evt">${EVENT_ICON}</span><h2>Etkinlikler</h2></div></div>
      ${eventsHtml}
      <form class="addform event" onsubmit="return handleAddEvent(event,'${key}')">
        <input name="title" placeholder="Etkinlik (ör. deneme sınavı)" autocomplete="off">
        <input name="time" placeholder="Saat" autocomplete="off">
        <input name="note" placeholder="Not (opsiyonel)" autocomplete="off">
        <button type="submit">Ekle</button>
      </form>
    </div>
    <button class="hist-toggle" onclick="toggleHistory()">${state.historyOpen?'▲ Geçmişi Gizle':'▼ Geçmişi Göster'}</button>
    ${historyHtml}
    <div class="note">Bu sayfadaki veriler bu linke erişen herkes tarafından görülüp düzenlenebilir. "Hafta Planı" sekmesinden gelecek günler için önceden ders/antrenman/etkinlik girebilirsiniz — girdiğiniz gün geldiğinde orada durmaya devam eder.</div>
  `;
}

function setWeekMode(m){ state.weekMode=m; writePref('weekMode',m); render(); }
function modeToggleHtml(){
  return `<div class="modetoggle" role="group" aria-label="Görünüm">
    <button class="${state.weekMode==='table'?'active':''}" onclick="setWeekMode('table')">Tablo</button>
    <button class="${state.weekMode==='list'?'active':''}" onclick="setWeekMode('list')">Liste</button>
  </div>`;
}
function setWkKind(k){
  state.wkAdd.kind=k;
  const f=document.getElementById('wkadd'); if(f) f.dataset.kind=k;
}
function prefillWkAdd(key,kind){
  state.wkAdd={day:key, kind};
  const f=document.getElementById('wkadd'); if(!f) return;
  f.day.value=key; f.dataset.kind=kind;
  const first = kind==='study'?f.minutes : kind==='sport'?f.sminutes : f.title;
  f.scrollIntoView({block:'nearest'}); first.focus();
}
function weekTableAdd(ev){
  ev.preventDefault(); const f=ev.target, key=f.day.value, kind=f.dataset.kind;
  state.wkAdd={day:key, kind};
  if(kind==='study'){
    const subject=f.subject.value, minutes=f.minutes.value;
    if(!subject){ flashError(f.subject); return false; }
    if(!minutes){ flashError(f.minutes); return false; }
    addEntry(key,subject,'',minutes);
  }else if(kind==='sport'){
    const minutes=f.sminutes.value;
    if(!minutes){ flashError(f.sminutes); return false; }
    addTraining(key,f.type.value,minutes,'');
  }else{
    const title=f.title.value.trim();
    if(!title){ flashError(f.title); return false; }
    addEvent(key,title,f.time.value.trim(),'');
  }
  return false;
}
function renderWeekTableHtml(){
  const mon = mondayOf(state.currentDate);
  const {ws,wt,we} = weekStats(state.currentDate);
  const rangeLabel = `${mon.getDate()} ${MONTHS[mon.getMonth()].slice(0,3)} – ${addDays(mon,6).getDate()} ${MONTHS[addDays(mon,6).getMonth()].slice(0,3)}`;
  const keys = []; for(let i=0;i<7;i++) keys.push(dkey(addDays(mon,i)));
  const todayKey = dkey(new Date());
  const selDay = keys.includes(state.wkAdd.day) ? state.wkAdd.day : (keys.includes(todayKey) ? todayKey : keys[0]);
  const kind = state.wkAdd.kind;
  let trainMins = 0;

  const rows = keys.map((key,i)=>{
    const wd = addDays(mon,i), data = getDay(key);
    const study = data.studyEntries.map(e=>{
      const st = e.status||'todo';
      return `<span class="chip study status-${st}"><button type="button" class="clicktext" title="Durumu değiştir" onclick="cycleStatus('${key}',${jsAttr(e.id)})">${escapeHtml(e.subject)} · ${escapeHtml(e.minutes)}dk</button><button type="button" class="x" aria-label="Sil" onclick="delEntry('${key}',${jsAttr(e.id)})">×</button></span>`;
    }).join('');
    const sport = data.training.map(e=>{ trainMins += parseInt(e.minutes)||0;
      return `<span class="chip sport"><span class="lbl">${escapeHtml(e.type)} · ${formatDuration(e.minutes)}</span><button type="button" class="x" aria-label="Sil" onclick="delTraining('${key}',${jsAttr(e.id)})">×</button></span>`; }).join('');
    const evts = (data.events||[]).map(e=>`<span class="chip event"><span class="lbl">${escapeHtml(e.title)}${e.time?' · '+escapeHtml(e.time):''}</span><button type="button" class="x" aria-label="Sil" onclick="delEvent('${key}',${jsAttr(e.id)})">×</button></span>`).join('');
    const plus = k => `<button type="button" class="plus" aria-label="Ekle" onclick="prefillWkAdd('${key}','${k}')">+</button>`;
    return `<tr class="${key===todayKey?'today':''} ${i>=5?'weekend':''}">
      <th class="daycell" scope="row"><button onclick="goToDate(new Date(${wd.getFullYear()},${wd.getMonth()},${wd.getDate()}))" title="Güne git"><span class="dw">${WEEKDAYS[i]}</span><span class="dn">${wd.getDate()}</span></button></th>
      <td><div class="cell">${study}${plus('study')}</div></td>
      <td><div class="cell">${sport}${plus('sport')}</div></td>
      <td><div class="cell">${evts}${plus('event')}</div></td>
    </tr>`;
  }).join('');

  const dayOpts = keys.map((k,i)=>{ const d=addDays(mon,i); return `<option value="${k}" ${k===selDay?'selected':''}>${WEEKDAYS[i]} ${d.getDate()}</option>`; }).join('');
  const subjOpts = state.subjects.map(s=>`<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join('');

  return `
    <div class="weeknav">
      <button onclick="shiftWeek(-1)">‹ Önceki</button>
      <span class="rng">${rangeLabel}</span>
      <button onclick="shiftWeek(1)">Sonraki ›</button>
    </div>
    <div class="weekbar">${modeToggleHtml()}</div>
    <form class="wkadd" id="wkadd" data-kind="${kind}" onsubmit="return weekTableAdd(event)">
      <select name="day" aria-label="Gün">${dayOpts}</select>
      <div class="kind" role="group" aria-label="Tür">
        <button type="button" data-k="study" onclick="setWkKind('study')">Ders</button>
        <button type="button" data-k="sport" onclick="setWkKind('sport')">Antrenman</button>
        <button type="button" data-k="event" onclick="setWkKind('event')">Etkinlik</button>
      </div>
      <select name="subject" class="f-study grow" aria-label="Ders">${subjOpts}</select>
      <input name="minutes" type="number" min="1" placeholder="dk" class="f-study num" aria-label="Dakika">
      <select name="type" class="f-sport grow" aria-label="Antrenman türü"><option value="Top">Top</option><option value="Kuvvet">Kuvvet</option></select>
      <input name="sminutes" type="number" min="1" placeholder="dk" class="f-sport num" aria-label="Dakika">
      <input name="title" placeholder="Etkinlik adı" class="f-event grow" autocomplete="off" aria-label="Etkinlik">
      <input name="time" placeholder="Saat" class="f-event num" autocomplete="off" aria-label="Saat">
      <button type="submit" class="go">Ekle</button>
    </form>
    <div class="wktable-wrap">
      <table class="wktable">
        <colgroup><col class="c-day"><col><col><col></colgroup>
        <thead><tr><th></th><th><span class="dotc" style="background:var(--study)"></span>Ders</th><th><span class="dotc" style="background:var(--sport)"></span>Antrenman</th><th><span class="dotc" style="background:var(--event)"></span>Etkinlik</th></tr></thead>
        <tbody>${rows}</tbody>
        <tfoot><tr><th>Top.</th><td><b>${ws}</b> dk</td><td><b>${wt}</b>/7 gün · ${formatDuration(trainMins)}</td><td><b>${we}</b> etkinlik</td></tr></tfoot>
      </table>
    </div>
    <div class="note">Ders kaydına dokununca durumu değişir (Yapılacak → Devam → Tamam). Hücredeki + o günü ve türü ekleme çubuğuna getirir. Gün numarasına dokunarak o günün detayına geçebilirsiniz.</div>
  `;
}

function renderWeekHtml(){
  if(state.weekMode==='table') return renderWeekTableHtml();
  const anchor = state.currentDate, mon = mondayOf(anchor);
  const {ws,wt,we} = weekStats(anchor);
  const rangeLabel = `${mon.getDate()} ${MONTHS[mon.getMonth()].slice(0,3)} – ${addDays(mon,6).getDate()} ${MONTHS[addDays(mon,6).getMonth()].slice(0,3)}`;

  let cards = '';
  for(let i=0;i<7;i++){
    const wd = addDays(mon,i), key = dkey(wd), data = getDay(key), isToday = sameDay(wd,new Date());
    const studyChips = data.studyEntries.map(e=>{
      const st = e.status||'todo';
      return `<span class="chip study status-${st}"><button type="button" class="clicktext" onclick="cycleStatus('${key}',${jsAttr(e.id)})">${escapeHtml(e.subject)} · ${escapeHtml(e.minutes)}dk</button><button type="button" class="x" aria-label="Sil" onclick="delEntry('${key}',${jsAttr(e.id)})">×</button></span>`;
    }).join('');
    const eventChips = (data.events||[]).map(e=>`<span class="chip event">${escapeHtml(e.title)}${e.time?' · '+escapeHtml(e.time):''}<button type="button" class="x" aria-label="Sil" onclick="delEvent('${key}',${jsAttr(e.id)})">×</button></span>`).join('');
    const trainingChips = data.training.map(e=>`<span class="chip sport">${escapeHtml(e.type)} · ${formatDuration(e.minutes)}<button type="button" class="x" aria-label="Sil" onclick="delTraining('${key}',${jsAttr(e.id)})">×</button></span>`).join('');

    cards += `
      <div class="weekcard ${isToday?'today':''}">
        <div class="datecol"><div class="dn">${wd.getDate()}</div><div class="dw">${MONTHS[wd.getMonth()].slice(0,3)}</div></div>
        <div class="body">
        <div class="weekcard-head">
          <div class="wd">${WEEKDAYS_FULL[i]}${isToday?'<span class="datep">bugün</span>':''}</div>
          <button class="goto" onclick="goToDate(new Date(${wd.getFullYear()},${wd.getMonth()},${wd.getDate()}))">Güne git →</button>
        </div>
        <div class="sectionlbl">Ders</div>
        ${studyChips?`<div class="chiprow">${studyChips}</div>`:''}
        <form class="quickrow" onsubmit="return weekAddStudy(event,'${key}')">
          <select name="subject">${state.subjects.map(s=>`<option value="${escapeHtml(s)}">${escapeHtml(s)}</option>`).join('')}</select>
          <input name="minutes" type="number" min="1" placeholder="dk" class="small">
          <button type="submit">+</button>
        </form>
        <div class="sectionlbl sport">Antrenman</div>
        ${trainingChips?`<div class="chiprow">${trainingChips}</div>`:''}
        <form class="quickrow sport" onsubmit="return weekAddTraining(event,'${key}')">
          <select name="type"><option value="Top">Top</option><option value="Kuvvet">Kuvvet</option></select>
          <input name="minutes" type="number" min="1" placeholder="dk" class="small">
          <button type="submit">+</button>
        </form>
        <div class="sectionlbl event">Etkinlik</div>
        ${eventChips?`<div class="chiprow">${eventChips}</div>`:''}
        <form class="quickrow event" onsubmit="return weekAddEvent(event,'${key}')">
          <input name="title" placeholder="Etkinlik" autocomplete="off">
          <input name="time" placeholder="Saat" class="small">
          <button type="submit">+</button>
        </form>
        </div>
      </div>`;
  }

  return `
    <div class="weeknav">
      <button onclick="shiftWeek(-1)">‹ Önceki</button>
      <span class="rng">${rangeLabel}</span>
      <button onclick="shiftWeek(1)">Sonraki ›</button>
    </div>
    <div class="weekbar">${modeToggleHtml()}</div>
    ${statsHtml(ws,wt,we,true)}
    ${cards}
    <div class="note">Bu görünümde önümüzdeki (veya geçmiş) günlere doğrudan ders, antrenman ve etkinlik girebilirsiniz. Girdiğiniz gün geldiğinde kayıtlar orada duruyor olacak — "Gün" sekmesinden o güne gidip detaylandırabilirsiniz.</div>
  `;
}

function handleAdd(ev,key){
  ev.preventDefault(); const f=ev.target;
  const subject=f.subject.value.trim(), topic=f.topic.value.trim(), minutes=f.minutes.value;
  let ok=true;
  if(!subject){ flashError(f.subject); ok=false; }
  if(!minutes){ flashError(f.minutes); ok=false; }
  if(ok){ addEntry(key,subject,topic,minutes); f.reset(); }
  return false;
}
function handleAddSubject(ev){
  ev.preventDefault(); const f=ev.target;
  const name = f.newsubject.value.trim();
  if(name){ addSubject(name); f.reset(); } else { flashError(f.newsubject); }
  return false;
}
function handleAddEvent(ev,key){
  ev.preventDefault(); const f=ev.target;
  const title=f.title.value.trim(), time=f.time.value.trim(), note=f.note.value.trim();
  if(title){ addEvent(key,title,time,note); f.reset(); } else { flashError(f.title); }
  return false;
}
function handleUpdateEvent(ev,key,id){
  ev.preventDefault(); const f=ev.target;
  const title=f.etitle.value.trim(), time=f.etime.value.trim(), note=f.enote.value.trim();
  if(title){ updateEvent(key,id,title,time,note); } else { flashError(f.etitle); }
  return false;
}
function handleAddTraining(ev,key){
  ev.preventDefault(); const f=ev.target;
  const type=f.type.value, minutes=f.minutes.value, note=f.note.value.trim();
  let ok=true;
  if(!type){ flashError(f.type); ok=false; }
  if(!minutes){ flashError(f.minutes); ok=false; }
  if(ok){ addTraining(key,type,minutes,note); f.reset(); }
  return false;
}
function weekAddStudy(ev,key){
  ev.preventDefault(); const f=ev.target;
  const subject=f.subject.value.trim(), minutes=f.minutes.value;
  let ok=true;
  if(!subject){ flashError(f.subject); ok=false; }
  if(!minutes){ flashError(f.minutes); ok=false; }
  if(ok){ addEntry(key,subject,'',minutes); f.reset(); }
  return false;
}
function weekAddEvent(ev,key){
  ev.preventDefault(); const f=ev.target;
  const title=f.title.value.trim(), time=f.time.value.trim();
  if(title){ addEvent(key,title,time,''); f.reset(); } else { flashError(f.title); }
  return false;
}
function weekAddTraining(ev,key){
  ev.preventDefault(); const f=ev.target;
  const type=f.type.value, minutes=f.minutes.value;
  let ok=true;
  if(!type){ flashError(f.type); ok=false; }
  if(!minutes){ flashError(f.minutes); ok=false; }
  if(ok){ addTraining(key,type,minutes,''); f.reset(); }
  return false;
}
function toggleHistory(){ state.historyOpen = !state.historyOpen; render(); }


window.addEventListener('DOMContentLoaded', init);
</script>
</body>
</html>
