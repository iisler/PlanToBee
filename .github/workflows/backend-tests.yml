# Backend testleri: derleme, bekleyen model değişikliği kontrolü, Web Push şifreleme testi ve uçtan uca API senaryosu
# (backend/tests/e2e.py) geçici bir PostgreSQL ile. Backend'e dokunan her PR'da ve elle çalışır.
#
# Gizli değer gerekmez: veritabanı ve anahtarlar bu çalışmaya özeldir, iş bitince silinir. E-postalar dosyaya yazılır
# (Development, LogEmailSender); hiçbir yere e-posta gönderilmez.
name: Backend testleri

on:
  pull_request:
    paths:
      - "backend/**"
      - ".github/workflows/backend-tests.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-tests-${{ github.ref }}
  cancel-in-progress: true

jobs:
  e2e:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    services:
      postgres:
        # db-backup.yml ile aynı imaj.
        image: postgres:18.6@sha256:3a4264520e121176619f54ff867d12774bc81e95e7b84db58d63bccdb6144b81
        env:
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: plantobee_e2e
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres"
          --health-interval 2s --health-timeout 5s --health-retries 30
    env:
      DOTNET_CLI_TELEMETRY_OPTOUT: "1"
      DOTNET_NOLOGO: "1"
      ASPNETCORE_ENVIRONMENT: Development
      ConnectionStrings__Default: Host=localhost;Database=plantobee_e2e;Username=postgres;Password=postgres
      Email__OutputDirectory: /tmp/plantobee-emails
      RateLimits__Auth: "1000"
      RateLimits__Pin: "1000"
      RateLimits__Api: "100000"
      WebPush__TestEndpointHosts__0: localhost
      WebPush__BatchSeconds: "2"
      Auth__EmailCode__MinIntervalSeconds: "0"
      Auth__EmailCode__MaxPerHour: "1000"
      Auth__PasswordReset__MinIntervalSeconds: "0"
      Auth__PasswordReset__MaxPerHour: "1000"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 10.0.x

      - name: Geçici anahtarları üret
        run: |
          # Bu çalışmaya özel, atılacak anahtarlar (EF araçları da uygulamayı başlattığı için en başta).
          echo "Jwt__Key=$(openssl rand -base64 48)" >> "$GITHUB_ENV"
          echo "WebPush__Key=$(openssl rand -base64 48)" >> "$GITHUB_ENV"

      - name: Derle
        run: |
          dotnet build backend/PlanToBee.API
          dotnet build backend/tests/WebPushSelfTest

      - name: Bekleyen model değişikliği yok (migration unutulmamış)
        run: |
          dotnet tool install --global dotnet-ef --version "10.*"
          dotnet ef migrations has-pending-model-changes --project backend/PlanToBee.API --no-build

      - name: Web Push şifreleme testi
        run: dotnet run --project backend/tests/WebPushSelfTest --no-build

      - name: Uçtan uca senaryo
        run: |
          mkdir -p "$Email__OutputDirectory"
          nohup dotnet run --project backend/PlanToBee.API --no-build --no-launch-profile --urls http://localhost:5102 > api.log 2>&1 &
          for _ in $(seq 1 90); do
            curl -fs http://localhost:5102/health > /dev/null && break
            sleep 1
          done
          curl -fs http://localhost:5102/health || { echo "::error::API açılmadı"; cat api.log; exit 1; }
          echo
          python3 backend/tests/e2e.py --api http://localhost:5102/api --emails "$Email__OutputDirectory" \
            --psql "psql postgresql://postgres:postgres@localhost:5432/plantobee_e2e"

      - name: API günlüğü
        if: failure()
        run: tail -n 300 api.log || true
