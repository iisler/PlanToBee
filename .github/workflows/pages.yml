# GitHub Pages yayını: https://iisler.github.io/PlanToBee/
#   /PlanToBee/      → /PlanToBee/app/'e yönlendiren sade sayfa (dışarıdan hiçbir şey yüklemez)
#   /PlanToBee/app/  → frontend/ (React sürümü)
# Kökteki eski index.html (Firebase sürümü) yalnızca React sürümü derlenemezse yayınlanır: Google Fonts ve Firebase
# yüklediği için aydınlatma metniyle uyumlu değildir (KVKK kontrolü, 12.11.2026).
#
# Gerekenler (bir kez, bkz. docs/DEPLOY.md):
#   - Settings > Pages > Build and deployment > Source: "GitHub Actions"
#   - Settings > Secrets and variables > Actions > Variables: VITE_API_URL (ör. https://plantobee-api.onrender.com/api)
# VITE_API_URL tanımlı değilse yalnızca eski index.html yayınlanır; React sürümü atlanır.
name: GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: false

env:
  APP_BASE: /PlanToBee/app/

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Eski sürümü kopyala
        run: |
          mkdir -p _site
          cp index.html favicon.svg apple-touch-icon.png _site/

      - uses: actions/setup-node@v4
        if: vars.VITE_API_URL != ''
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: React sürümünü derle
        if: vars.VITE_API_URL != ''
        working-directory: frontend
        env:
          VITE_API_URL: ${{ vars.VITE_API_URL }}
          VITE_BASE_PATH: ${{ env.APP_BASE }}
        run: |
          npm ci
          npm run build
          cp -R dist ../_site/app

      # GitHub Pages bilinmeyen yollar için kökteki 404.html'i gösterir. /PlanToBee/app/invite gibi derin
      # linklerde React uygulaması açılsın diye 404.html uygulamanın index.html'inin kopyasıdır; uygulama
      # dışındaki yollar React sürümüne yönlendirilir.
      - name: Derin linkler için 404.html
        if: vars.VITE_API_URL != ''
        run: |
          sed "s|<head>|<head><script>if(!location.pathname.startsWith('${APP_BASE}'))location.replace('${APP_BASE}')</script>|" \
            _site/app/index.html > _site/404.html
          grep -q "location.replace('${APP_BASE}')" _site/404.html

      # Ana sayfa artık eski Firebase sürümü değil: React sürümüne yönlendirir.
      - name: Ana sayfayı React sürümüne yönlendir
        if: vars.VITE_API_URL != ''
        run: |
          cat > _site/index.html <<HTML
          <!doctype html>
          <html lang="tr"><head><meta charset="utf-8">
          <meta name="viewport" content="width=device-width, initial-scale=1">
          <title>PlanToBee</title><link rel="icon" type="image/svg+xml" href="favicon.svg">
          <meta http-equiv="refresh" content="0; url=${APP_BASE}">
          <script>location.replace('${APP_BASE}')</script>
          </head><body style="margin:0;background:#F3ECDC;font:15px/1.6 system-ui,sans-serif;padding:24px 16px">
          <a href="${APP_BASE}">PlanToBee'ye git</a>
          </body></html>
          HTML
          ! grep -qE "googleapis|gstatic|firebase" _site/index.html

      - name: React sürümü atlandı
        if: vars.VITE_API_URL == ''
        run: echo "::warning::VITE_API_URL tanımlı değil; yalnızca eski index.html (Firebase sürümü) yayınlanıyor."

      - uses: actions/upload-pages-artifact@v3
        with:
          path: _site

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
